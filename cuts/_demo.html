<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liminal · Decisions with receipts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0b0d'/%3E%3Cpath d='M16 5 27 16 16 27 5 16Z' fill='none' stroke='%238E66FB' stroke-width='2'/%3E%3C/svg%3E">
<!--
  ════════════════════════════════════════════════════════════════════════
  Demo path · "Decisions with receipts"                     [LIM-2187]

  Purpose    · one guided, narration-free walk through three existing cuts,
               in order: 01 slate-tray → 11 govern → 10 today.
               goal → option → evidence → ratified decision → record.
  Mechanism  · a thin frame around the real cuts (iframe). No cut is forked;
               each step loads the cut's own URL. Step 2 is the JSV URL
               verbatim (LIM-1554 P0 contract: route and params never change).
  Labeling   · the bar stays on every screen and always reads
               "prototype · deterministic fixtures".
  Maturity   · refining
  Status     · live (demo path)
  Addressing · ?step=1|2|3 (default 1). Prev/next, and ← / → when focus is
               on this frame rather than inside a cut.
  Tests      · tests/demo-path.spec.js
  ════════════════════════════════════════════════════════════════════════
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../design-system/tokens/design-tokens.css">
<style>
@font-face{font-family:"Nineties Headliner";src:url("../fonts/nineties-headliner.otf") format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"Perfectly Nineties";src:url("../fonts/perfectly-nineties-regular.otf") format("opentype");font-weight:400;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:var(--fs-body)/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100dvh}

.demo-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3) var(--space-4);
  padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--frame-border);background:var(--frame-bg)}
.demo-id{display:flex;flex-direction:column;gap:2px;min-width:0}
.demo-title{font-family:var(--display);font-size:var(--fs-lg);line-height:1.1;margin:0;font-weight:400}
.demo-label{font-family:var(--mono);font-size:var(--fs-mono-xs);letter-spacing:.08em;text-transform:uppercase;color:var(--text-mid)}
.demo-steps{display:flex;gap:var(--space-2);list-style:none;margin:0;padding:0;font-family:var(--mono);font-size:var(--fs-mono-xs);
  letter-spacing:.06em;text-transform:uppercase}
.demo-steps a{display:inline-block;padding:var(--space-1) var(--space-2);border:1px solid var(--card-border);border-radius:var(--radius-pill);
  color:var(--text-mid);text-decoration:none}
.demo-steps a[aria-current="step"]{color:var(--text);border-color:var(--diligence)}
.demo-nav{display:flex;gap:var(--space-2);margin-left:auto}
.demo-nav button{font:inherit;font-family:var(--mono);font-size:var(--fs-mono-sm);letter-spacing:.06em;text-transform:uppercase;
  min-height:44px;min-width:44px;padding:0 var(--space-4);color:var(--text);background:transparent;
  border:1px solid var(--card-border-2);border-radius:var(--radius-2);cursor:pointer}
.demo-nav button[disabled]{color:var(--text-faint);cursor:default}
.demo-say{flex-basis:100%;margin:0;font-family:var(--serif);font-size:var(--fs-md);line-height:1.45;color:var(--text);text-wrap:pretty}
.demo-say .demo-open{font-family:var(--mono);font-size:var(--fs-mono-xs);letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-mid);margin-left:var(--space-2);white-space:nowrap}

:focus-visible{outline:2px solid var(--diligence);outline-offset:2px}

.demo-stage{flex:1;display:flex;min-height:0}
.demo-stage iframe{flex:1;width:100%;min-height:70dvh;border:0;background:var(--bg)}

@media (prefers-reduced-motion:no-preference){
  .demo-nav button,.demo-steps a{transition:border-color .15s var(--ease-out),color .15s var(--ease-out)}
}
@media (max-width:640px){
  .demo-nav{margin-left:0;width:100%}
  .demo-nav button{flex:1}
}
</style>
</head>
<body>
<header class="demo-bar" role="banner">
  <div class="demo-id">
    <h1 class="demo-title">Decisions with receipts</h1>
    <span class="demo-label" data-demo-label>prototype · deterministic fixtures</span>
  </div>
  <nav aria-label="Demo steps">
    <ol class="demo-steps" id="demo-steps"></ol>
  </nav>
  <div class="demo-nav">
    <button type="button" id="demo-prev">← Prev</button>
    <button type="button" id="demo-next">Next →</button>
  </div>
  <p class="demo-say" id="demo-say" aria-live="polite"></p>
</header>
<main class="demo-stage">
</main>
<script>
(function () {
  // Order is the contract: 01 → 11 → 10. Step 2's src is the JSV URL verbatim (LIM-1554).
  var STEPS = [
    { key: "decide", name: "Decide", src: "01-slate-tray.html",
      title: "Cut 01 · a decision on the slate",
      say: "One founder decision with the goal, the options and the evidence laid out as tiles; three agents read the same slate and are allowed to disagree." },
    { key: "ratify", name: "Ratify", src: "11-govern.html?subject=spend&beat=loop&run=govern-run.json",
      title: "Cut 11 · a ruling on AI spend",
      say: "The same loop on a team's AI spend: spend is read against a stated goal, a person ratifies the ruling, and each step is written to an audit chain you can open." },
    { key: "record", name: "Record", src: "10-today.html",
      title: "Cut 10 · the record comes back",
      say: "The next day: what was decided comes back to be checked against how it landed, and what was sent out keeps binding the agents until it expires." }
  ];
  var stage = document.querySelector(".demo-stage");
  var say = document.getElementById("demo-say");
  var prev = document.getElementById("demo-prev");
  var next = document.getElementById("demo-next");
  var list = document.getElementById("demo-steps");

  function stepFromUrl() {
    var n = parseInt(new URLSearchParams(location.search).get("step"), 10);
    return n >= 1 && n <= STEPS.length ? n : 1;
  }

  list.innerHTML = STEPS.map(function (s, i) {
    return '<li><a href="?step=' + (i + 1) + '" data-step="' + (i + 1) + '">' + (i + 1) + " · " + s.name + "</a></li>";
  }).join("");

  var current = 0;
  function render(n, push) {
    current = n;
    var s = STEPS[n - 1];
    // A fresh iframe per step: re-pointing src would add entries to the joint
    // session history, and browser Back would walk the cut instead of the steps.
    var frame = document.createElement("iframe");
    frame.id = "demo-frame";
    frame.title = s.title;
    frame.src = s.src;
    frame.setAttribute("data-step", String(n));
    stage.replaceChildren(frame);
    say.innerHTML = "";
    say.appendChild(document.createTextNode(s.say));
    var open = document.createElement("a");
    open.className = "demo-open";
    open.href = s.src;
    open.textContent = "open this screen alone ↗";
    say.appendChild(open);
    prev.disabled = n === 1;
    next.textContent = n === STEPS.length ? "Start over ↺" : "Next →";
    list.querySelectorAll("a").forEach(function (a) {
      if (a.getAttribute("data-step") === String(n)) a.setAttribute("aria-current", "step");
      else a.removeAttribute("aria-current");
    });
    document.title = "Liminal · Decisions with receipts · " + n + " of " + STEPS.length;
    if (push) history.pushState({ step: n }, "", "?step=" + n);
  }

  function go(n) { if (n >= 1 && n <= STEPS.length && n !== current) render(n, true); }
  prev.addEventListener("click", function () { go(current - 1); });
  next.addEventListener("click", function () { go(current === STEPS.length ? 1 : current + 1); });
  list.addEventListener("click", function (e) {
    var a = e.target.closest("a[data-step]");
    if (!a) return;
    e.preventDefault();
    go(parseInt(a.getAttribute("data-step"), 10));
  });
  document.addEventListener("keydown", function (e) {
    if (e.altKey || e.metaKey || e.ctrlKey) return;
    if (e.key === "ArrowRight" && current < STEPS.length) go(current + 1);
    if (e.key === "ArrowLeft") go(current - 1);
  });
  window.addEventListener("popstate", function () { render(stepFromUrl(), false); });

  render(stepFromUrl(), false);
})();
</script>
</body>
</html>
